name: Linky extension migration scaffold
on:
  push:
    branches: [qa/linky-extension-scaffold-20261105]
permissions:
  contents: read
jobs:
  scaffold:
    if: github.ref == 'refs/heads/qa/linky-extension-scaffold-20261105'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.21.0
      - name: Generate one unlinked migration source
        run: |
          npm exec --yes --package=supabase@2.122.0 -- supabase --version
          npm exec --yes --package=supabase@2.122.0 -- supabase migration new --help
          npm exec --yes --package=supabase@2.122.0 -- supabase migration new linky_service_extension </dev/null
      - name: Verify and export only the new scaffold
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, readdirSync, existsSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          import { deflateSync } from 'node:zlib';
          import assert from 'node:assert/strict';
          assert.equal(process.version, 'v24.21.0');
          const first = readFileSync('supabase/migrations/20261105080045_linky_initial_service.sql');
          assert.equal(createHash('sha256').update(first).digest('hex'), '406957876504aeb4c99a42f6488f24c325aaf9c2e41b8dc501f5c227b08249be');
          const files = readdirSync('supabase/migrations').filter(x => /_linky_service_extension\.sql$/.test(x));
          assert.equal(files.length, 1);
          assert.match(files[0], /^\d{14}_linky_service_extension\.sql$/);
          const path = 'supabase/migrations/' + files[0];
          const content = readFileSync(path, 'utf8');
          assert.equal(content, '');
          assert.equal(existsSync('supabase/.temp/project-ref'), false);
          assert.equal(existsSync('node_modules'), false);
          for (const key of ['DATABASE_URL','PGHOST','PGPASSWORD','SUPABASE_ACCESS_TOKEN','SUPABASE_DB_PASSWORD']) assert.equal(Boolean(process.env[key]), false);
          const output = { schemaVersion: 1, path, content, sha256: createHash('sha256').update(content).digest('hex'), node: process.version, cli: '2.122.0', databaseConnections: 0, productTestsExecuted: 0 };
          console.log('LINKY_EXTENSION_SCAFFOLD=' + deflateSync(Buffer.from(JSON.stringify(output))).toString('base64'));
          NODE
